<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flash Cards Webapp</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Study deck</p>
        <h1 id="deck-title">Flashcards</h1>
      </div>
      <div class="header-actions">
        <span id="card-count" class="count-pill">0 cards</span>
        <label class="select-control" for="chapter-filter">
          <span>Chapter</span>
          <select id="chapter-filter" class="chapter-select">
            <option value="__all__">All chapters</option>
          </select>
        </label>
        <div class="mode-toggle" role="group" aria-label="Card order mode">
          <button class="mode-button is-active" type="button" data-mode="shuffled" aria-pressed="true">Shuffled</button>
          <button class="mode-button" type="button" data-mode="sorted" aria-pressed="false">Sorted</button>
        </div>
      </div>
    </header>

    <main>
      <section id="status" class="status" aria-live="polite">Loading cards...</section>
      <section class="study-stage" aria-label="Flashcard viewer">
        <button id="previous-card" class="nav-button icon-button" type="button" aria-label="Previous card" title="Previous card">
          <span aria-hidden="true">&#8592;</span>
        </button>
        <section id="card-stage" class="single-card" aria-label="Current flashcard"></section>
        <button id="next-card" class="nav-button icon-button" type="button" aria-label="Next card" title="Next card">
          <span aria-hidden="true">&#8594;</span>
        </button>
      </section>
    </main>
  </body>
</html>
